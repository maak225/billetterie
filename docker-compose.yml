services:
  postgres:
    image: postgres:17
    container_name: billetterie-postgres
    environment:
      POSTGRES_DB: billetterie
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: billetterie-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  pg_data: